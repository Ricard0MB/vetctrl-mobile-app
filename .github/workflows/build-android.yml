name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'


      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Compilar la app web (producción)
        run: npm run build -- --configuration=production

      - name: Sincronizar con Capacitor Android
        run: npx cap sync android

      - name: Dar permisos a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK de debug
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: vetctrl-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30