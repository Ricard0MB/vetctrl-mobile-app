<ion-content [fullscreen]="true" class="auth-content">
  <div class="bg-paw-bottom">🐾</div>
  <div class="bg-paw-top">🐾</div>

  <button class="theme-toggle" (click)="toggleTheme()">
    <ion-icon [name]="isDarkMode ? 'sunny-outline' : 'moon-outline'"></ion-icon>
  </button>

  <div class="auth-wrapper">
    <div class="auth-card">
      
      <!-- Imagen superior (Centrada y con límite) -->
      <div class="auth-image">
        <img src="assets/images/fondo-mascotas.png" alt="Mascotas felices">
      </div>

      <div class="auth-form">
        <h1 class="brand-title">VetCtrl</h1>
        <h2 class="subtitle">Iniciar Sesión</h2>

        <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>
        <div *ngIf="successMessage" class="success-message">{{ successMessage }}</div>

        <form (ngSubmit)="onSubmit()" autocomplete="off">
          
          <div class="input-group">
            <label for="user_input">Usuario o Correo</label>
            <input type="text" id="user_input" name="user_input" [(ngModel)]="username" 
                   placeholder="ejemplo@correo.com" required autocomplete="on" class="custom-input">
          </div>

          <div class="input-group">
            <label for="password">Contraseña</label>
            <div class="password-wrapper">
              <input type="password" id="password" name="password" [(ngModel)]="password" 
                     placeholder="••••••••" required autocomplete="new-password"
                     [type]="showPassword ? 'text' : 'password'" class="custom-input">
              
              <!-- Botón del perrito (Tamaño controlado) -->
              <button type="button" class="toggle-password" (click)="togglePassword()">
                <img [src]="showPassword ? 'assets/images/cama.png' : 'assets/images/perro.png'" 
                     alt="Icono mostrar">
              </button>
            </div>
          </div>

          <button type="submit" class="btn-submit" [disabled]="isLoading">
            <span *ngIf="!isLoading">Ingresar</span>
            <span *ngIf="isLoading">⏳</span>
          </button>
        </form>

        <div class="auth-links">
          <p>¿No tienes cuenta? <a routerLink="/register">Regístrate</a></p>
          
          <!-- BOTÓN DE RECUPERAR CONTRASEÑA -->
          <ion-button fill="clear" routerLink="/forgot-password" class="forgot-btn">
            ¿Olvidaste tu contraseña?
          </ion-button>
          
          <p><a href="#" (click)="openTutorial($event)">¿No sabes qué hacer?</a></p>
        </div>
      </div>
    </div>
  </div>

  <footer class="copyright-footer">
    <p>© 2026 VetCtrl. Todos los derechos reservados.</p>
  </footer>

  <!-- Modal del Tutorial -->
  <div class="tutorial-overlay" [class.active]="isTutorialOpen">
    <div class="tutorial-modal">
      <div class="tutorial-header">
        <h3>🎓 Tutorial de VetCtrl</h3>
        <button (click)="closeTutorial()">&times;</button>
      </div>
      <div class="tutorial-content">
        <div class="step-title">{{ steps[currentStep].title }}</div>
        <div class="step-desc" [innerHTML]="steps[currentStep].desc"></div>
      </div>
      <div class="tutorial-footer">
        <button class="btn-prev" [style.visibility]="currentStep === 0 ? 'hidden' : 'visible'" (click)="prevStep()">← Anterior</button>
        <button class="btn-next" (click)="nextStep()">
          {{ currentStep === steps.length - 1 ? 'Finalizar' : 'Siguiente →' }}
        </button>
      </div>
      <div class="step-indicators">
        <div class="step-dot" *ngFor="let step of steps; let i = index" [class.active]="i === currentStep"></div>
      </div>
    </div>
  </div>
</ion-content>
