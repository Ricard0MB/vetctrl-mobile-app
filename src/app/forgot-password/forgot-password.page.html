<ion-content [fullscreen]="true" class="auth-content">
  <div class="bg-paw-bottom">🐾</div>
  <div class="bg-paw-top">🐾</div>

  <div class="auth-wrapper">
    <div class="auth-card">
      
      <!-- Botón para volver atrás -->
      <ion-button fill="clear" class="back-btn" routerLink="/login">
        <ion-icon slot="start" name="arrow-back"></ion-icon> Volver
      </ion-button>

      <div class="auth-form">
        <h1 class="brand-title">VetCtrl</h1>
        <h2 class="subtitle">Recuperar Contraseña</h2>

        <p class="instructions">
          Ingresa el correo con el que te registraste y te enviaremos un enlace para restablecer tu contraseña.
        </p>

        <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>
        <div *ngIf="successMessage" class="success-message">{{ successMessage }}</div>

        <form (ngSubmit)="onSubmit()" autocomplete="off" *ngIf="!successMessage">
          <div class="input-group">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" name="email" [(ngModel)]="email" 
                   placeholder="ejemplo@correo.com" required class="custom-input">
          </div>

          <button type="submit" class="btn-submit" [disabled]="isLoading || !email">
            <span *ngIf="!isLoading">Enviar enlace</span>
            <span *ngIf="isLoading">Enviando... ⏳</span>
          </button>
        </form>

      </div>
    </div>
  </div>
</ion-content>
