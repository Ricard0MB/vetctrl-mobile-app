<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>VetBot IA</ion-title>
    <ion-buttons slot="end">
      <ion-button>
        <ion-icon slot="icon-only" name="ellipsis-vertical"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="chat-background">
  <div class="chat-container" #chatContainer>

    <!-- Fecha de hoy -->
    <div class="date-divider">
      <span>Hoy</span>
    </div>

    <div *ngFor="let msg of messages; let i = index" class="message-row" [class.user-row]="msg.isUser">
      <!-- Avatar solo para el bot -->
      <div class="avatar" *ngIf="!msg.isUser">
        <ion-icon name="hardware-chip-outline"></ion-icon>
      </div>

      <!-- Burbuja del mensaje -->
      <div class="bubble" [class.user-bubble]="msg.isUser" [class.bot-bubble]="!msg.isUser">
        <p>{{ msg.text }}</p>

        <!-- 🔥 BOTONES DE OPCIÓN (encuestas responsivas) -->
        <div *ngIf="msg.options && msg.options.length > 0" class="options-container">
          <ion-button
            *ngFor="let opt of msg.options"
            fill="outline"
            size="small"
            class="ion-margin-top option-btn"
            (click)="onOptionClick(msg, opt)">
            {{ opt.texto }}
          </ion-button>
        </div>

        <span class="time">{{ msg.time | date:'shortTime' }}</span>
      </div>
    </div>

    <!-- Animación de "Escribiendo..." -->
    <div class="message-row" *ngIf="isBotTyping">
      <div class="avatar"><ion-icon name="hardware-chip-outline"></ion-icon></div>
      <div class="bubble bot-bubble">
        <div class="typing-indicator"><span></span><span></span><span></span></div>
      </div>
    </div>
  </div>
</ion-content>

<!-- Barra de entrada -->
<ion-footer class="chat-footer">
  <div class="input-wrapper">
    <ion-input
      [(ngModel)]="newMessage"
      placeholder="Escribe un mensaje..."
      (keyup.enter)="sendMessage()"
      class="chat-input">
    </ion-input>
    <ion-button fill="clear" class="send-btn" (click)="sendMessage()" [disabled]="!newMessage.trim()">
      <ion-icon name="send" slot="icon-only"></ion-icon>
    </ion-button>
  </div>
</ion-footer>
